# Generate the Xcode project on a Mac:  brew install xcodegen && xcodegen generate
name: GoldenHarbour
options:
  bundleIdPrefix: com.jenniferlogic
  deploymentTarget:
    iOS: "17.0"
targets:
  GoldenHarbour:
    type: application
    platform: iOS
    sources: [GHMS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jenniferlogic.goldenharbour
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: GHMS/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        # Set DEVELOPMENT_TEAM to your Apple Developer Team ID
