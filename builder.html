<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gigle-AI Page Builder | Jennifer Logic</title>
    <style>
        :root { --fg: #00ffcc; --bg: #0a0a0c; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--fg); font-family: 'Courier New', monospace; height: 100vh; display: grid; grid-template-columns: 340px 1fr; }
        aside { display: flex; flex-direction: column; padding: 14px; gap: 10px; border-right: 1px solid var(--fg); min-height: 0; }
        h1 { font-size: 1rem; }
        #chat { flex: 1; overflow-y: auto; font-size: .85rem; line-height: 1.4; }
        .msg { margin-bottom: 8px; white-space: pre-wrap; }
        .msg.me { opacity: .7; }
        textarea, button, select { background: rgba(0,0,0,.6); color: var(--fg); border: 1px solid var(--fg); border-radius: 4px; font: inherit; padding: 8px; }
        textarea { resize: vertical; min-height: 80px; }
        button { cursor: pointer; }
        button:hover, button:focus-visible { background: var(--fg); color: var(--bg); }
        button:disabled { opacity: .4; cursor: wait; }
        main { display: flex; flex-direction: column; min-width: 0; }
        .toolbar { display: flex; gap: 8px; padding: 10px; border-bottom: 1px solid var(--fg); flex-wrap: wrap; }
        .stage { flex: 1; display: flex; justify-content: center; background: #1a1a1f; overflow: auto; padding: 12px; }
        iframe { width: 100%; height: 100%; border: 0; background: #fff; transition: width .25s; }
        @media (max-width: 800px) { body { grid-template-columns: 1fr; grid-template-rows: 45vh 1fr; } aside { border-right: 0; border-bottom: 1px solid var(--fg); } }
    </style>
</head>
<body>
    <aside>
        <h1>&gt; Gigle-AI Page Builder</h1>
        <div id="chat" aria-live="polite"></div>
        <textarea id="prompt" aria-label="Describe your page" placeholder="Describe a page or a change, e.g. 'landing page for a community clinic, dark teal, hero + 3 feature cards'"></textarea>
        <button id="send">Generate</button>
        <a href="./" style="color:inherit">&larr; Terminal</a>
    </aside>
    <main>
        <div class="toolbar">
            <button id="undo">Undo</button><button id="redo">Redo</button>
            <select id="viewport" aria-label="Preview size"><option value="desktop">Desktop</option><option value="tablet">Tablet</option><option value="mobile">Mobile</option></select>
            <select id="theme" aria-label="Builder theme"></select>
            <button id="export">Export HTML</button>
        </div>
        <div class="stage"><iframe id="preview" sandbox="" title="Page preview"></iframe></div>
    </main>
    <script type="module" src="./builder-app.js"></script>
</body>
</html>
