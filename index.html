<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jennifer Logic</title>
    <style>
        body {
            background-color: #000000;
            color: #f5f5f7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1d1d1f;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 100%;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        p {
            color: #86868b;
            font-size: 16px;
            margin-bottom: 30px;
        }
        .btn {
            background-color: #00875a;
            color: white;
            padding: 12px 24px;
            border-radius: 980px;
            text-decoration: none;
            font-weight: 500;
            display: inline-block;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #006644;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Jennifer Logic</h1>
        <p>Welcome to the official portal.</p>
        <a href="mailto:AKdatabase@jenniferlogic.com" class="btn">Get in Touch</a>
    </div>
</body>
</html>
