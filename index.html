<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jennifer Logic | Sovereign Edge Portal</title>
    <style>
            :root { --fg: #00ffcc; --bg: #0a0a0c; }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: var(--bg);
            color: var(--fg);
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }
        #output-screen {
            flex-grow: 1;
            overflow-y: auto;
            margin-bottom: 15px;
            padding-right: 10px;
        }
        .terminal-line {
            margin-bottom: 8px;
            line-height: 1.4;
            text-shadow: 0 0 5px color-mix(in srgb, var(--fg) 50%, transparent);
        }
        .input-container {
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--fg);
            box-shadow: 0 0 12px color-mix(in srgb, var(--fg) 40%, transparent);
            backdrop-filter: blur(6px);
            padding: 10px;
            border-radius: 4px;
        }
        .prompt-symbol {
            margin-right: 10px;
            font-weight: bold;
        }
        #command-input {
            background: transparent;
            border: none;
            color: var(--fg);
            font-family: inherit;
            font-size: 1rem;
            width: 100%;
            outline: none;
        }
    </style>
</head>
<body>

    <div id="bg-canvas"></div>
    <div id="output-screen" aria-live="polite"></div>

    <div class="input-container">
        <span class="prompt-symbol">&gt;</span>
        <input type="text" id="command-input" placeholder="Type a command (e.g. 'help', 'theme list', 'ai hello')..." aria-label="Command input" autofocus>
    </div>

    <script type="module" src="./app.js"></script>
</body>
</html>
